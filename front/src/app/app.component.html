<div class="app">
  <mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <span data-cy="app-title">Yoga app</span>
    <div *ngIf="$isLogged() | async; else notLogged">
      <span routerLink="sessions" class="link">Sessions</span>
      <span routerLink="me" class="link" data-cy="profile-link">Account</span>
      <span data-cy="user-name" class="link">{{sessionInformation?.firstName}} {{sessionInformation?.lastName}}</span>
      <span (click)="logout()" class="link" data-cy="logout-button">Logout</span>
    </div>
    <ng-template #notLogged>
      <div>
        <span routerLink="login" class="link">Login</span>
        <span routerLink="register" class="link">Register</span>
      </div>
    </ng-template>
  </mat-toolbar>
  <div>
    <router-outlet></router-outlet>
  </div>
</div>
